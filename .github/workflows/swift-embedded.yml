name: Swift Embedded
on: [push]
jobs:
  build-bare-metal:
    name: Build for bare metal Embedded Swift
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add aarch64-none-none-elf, which has no _Concurrency module, once
        # GATT requires a Bluetooth release with EMBEDDED_NO_CONCURRENCY.
        triple: ["x86_64-unknown-none-elf", "armv7-none-none-eabi"]
    container: swift:6.4.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift Version
        run: swift --version
      - name: Build
        run: .github/scripts/embedded-bare-metal.sh ${{ matrix.triple }}
