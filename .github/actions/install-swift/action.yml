name: Install Swift
description: >-
  Installs a swift.org toolchain with swiftly on a macOS runner and puts it
  first on PATH. The runners' Xcode doesn't ship every Swift release.
inputs:
  version:
    description: The Swift release, such as 6.4.2
    required: true
runs:
  using: composite
  steps:
    - name: Install swiftly and Swift ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
        installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
        "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
        . "$HOME/.swiftly/env.sh"
        swiftly install --use --assume-yes "${{ inputs.version }}"
        echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
        echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
        echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
